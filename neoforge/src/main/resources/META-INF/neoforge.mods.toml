modLoader = "javafml"
loaderVersion = "1,)"
#issueTrackerURL = ""
license = "MIT"

[[mods]]
modId = "createtransmission"
version = "${version}"
displayName = "Create: Transmission"
authors = "SerpensSolida"
description = '''
This mod adds a single block: Transmission Chain!

This block can be used to power belts in a cleaner way without using encased chain drive.
'''
logoFile = "icon.png"

[[dependencies.createtransmission]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createtransmission]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.createtransmission]]
modId="create"
type = "required"
versionRange="${create_version}"
ordering="NONE"
side="BOTH"

[[mixins]]
config = "createtransmission-common.mixins.json"
[[mixins]]
config = "createtransmission.mixins.json"